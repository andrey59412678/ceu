<style>
:root {
  --night: #0a0e24; --night-2: #141a3d; --ivory: #f3ead8; --muted: #a7abc8;
  --gold: #d8b46a; --her: #f0b98c; --line: rgba(216, 180, 106, 0.28);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--night-2), var(--night) 70%) fixed, var(--night);
  color: var(--ivory);
  font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  display: grid; place-items: center;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 20px; text-align: center; }
h1 { font-family: "Bodoni Moda", Didot, Georgia, serif; font-weight: 500; font-size: clamp(40px, 12vw, 60px); line-height: 1.05; margin: 0; }
h1 span { display: block; color: var(--gold); font-size: .6em; margin: 4px 0; }
label { font-size: 18px; color: var(--muted); }
input {
  font: 700 32px/1 "Atkinson Hyperlegible", system-ui, sans-serif;
  letter-spacing: .5em; text-align: center; padding: 14px 0 14px .5em;
  background: rgba(20, 26, 61, .6); color: var(--ivory);
  border: 1px solid var(--line); border-radius: 14px; width: 100%; box-sizing: border-box;
}
input:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
button {
  font: 700 18px "Atkinson Hyperlegible", system-ui, sans-serif;
  padding: 14px; border-radius: 14px; border: 0; cursor: pointer;
  background: var(--gold); color: var(--night);
}
button:disabled { opacity: .5; cursor: default; }
.msg { min-height: 1.4em; color: var(--her); font-size: 16px; margin: 0; }
</style>

<script>
(() => {
  // The browser only exposes WebCrypto on secure origins.
  if (location.protocol === 'http:' && location.hostname !== 'localhost') {
    location.replace('https://' + location.host + location.pathname);
    return;
  }
  const payload = JSON.parse(document.getElementById('payload').textContent);
  const form = document.getElementById('gate');
  const input = document.getElementById('pin');
  const button = document.getElementById('open');
  const msg = document.getElementById('msg');
  const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

  async function unlock(pin) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt'],
    );
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv) }, key, bytes(payload.data));
    return new TextDecoder().decode(plain);
  }
  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const pin = input.value.trim();
    if (!/^\d{4}$/.test(pin)) { msg.textContent = 'A senha tem 4 números.'; return; }
    button.disabled = true;
    msg.textContent = 'Abrindo…';
    try {
      const html = await unlock(pin);
      try { sessionStorage.setItem('ceu-pin', pin); } catch {}
      show(html);
    } catch {
      msg.textContent = 'Senha errada. Tente de novo.';
      input.value = '';
      input.focus();
      button.disabled = false;
    }
  });
  let saved = null;
  try { saved = sessionStorage.getItem('ceu-pin'); } catch {}
  if (saved) unlock(saved).then(show).catch(() => {});
  else input.focus();
})();
</script>
